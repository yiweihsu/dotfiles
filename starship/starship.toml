# =====================================================
# Starship prompt config — Catppuccin Mocha Powerline
# =====================================================

add_newline = false

format = """
[](fg:#89b4fa)\
$directory\
[](fg:#89b4fa bg:#a6adc8)\
$git_branch\
$git_status\
[](fg:#a6adc8 bg:#45475a)\
$nodejs$python$rust$golang$docker_context$conda\
[](fg:#45475a) \
$fill\
$status$cmd_duration$time\
$line_break\
$character"""

# ── Directory ──────────────────────────────────────
[directory]
format = "[ $path ]($style)"
style = "fg:#1e1e2e bg:#89b4fa bold"
truncation_length = 3
truncation_symbol = ".../"

# ── Git ────────────────────────────────────────────
[git_branch]
symbol = " "
format = "[ $symbol$branch ]($style)"
style = "fg:#1e1e2e bg:#a6adc8"

[git_status]
format = "[$all_status$ahead_behind ]($style)"
style = "fg:#1e1e2e bg:#a6adc8"

# ── Languages / Runtimes ──────────────────────────
[nodejs]
symbol = "Node "
format = "[ $symbol$version ]($style)"
style = "fg:#cdd6f4 bg:#45475a"
detect_files = ["package.json", ".node-version"]

[python]
symbol = "Py "
format = "[ $symbol$version ]($style)"
style = "fg:#cdd6f4 bg:#45475a"

[rust]
symbol = "Rust "
format = "[ $symbol$version ]($style)"
style = "fg:#cdd6f4 bg:#45475a"

[golang]
symbol = "Go "
format = "[ $symbol$version ]($style)"
style = "fg:#cdd6f4 bg:#45475a"

[docker_context]
symbol = "Docker "
format = "[ $symbol$context ]($style)"
style = "fg:#cdd6f4 bg:#45475a"

[conda]
format = "[ $symbol$environment ]($style)"
style = "fg:#cdd6f4 bg:#45475a"

# ── Right-side info ────────────────────────────────
[fill]
symbol = " "

[cmd_duration]
min_time = 500
format = "[ took $duration]($style)"
style = "fg:#a6adc8"

[status]
disabled = false
format = "[ exit:$status]($style)"
style = "fg:#f38ba8"

[time]
disabled = false
time_format = "%H:%M"
format = "[ $time]($style)"
style = "fg:#89b4fa"

# ── Input line ─────────────────────────────────────
[character]
success_symbol = "[❯](bold #a6e3a1)"
error_symbol = "[❯](bold #f38ba8)"

# ── Disabled ───────────────────────────────────────
[username]
disabled = true

[hostname]
disabled = true
