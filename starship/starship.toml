# =====================================================
# Starship — minimal Catppuccin Mocha rounded prompt
# =====================================================

add_newline = false

format = """
$directory\
$git_branch\
$git_status\
$fill\
$status\
$cmd_duration\
$time\
$line_break\
$character"""

# Rounded directory pill
[directory]
format = "[](fg:#89b4fa)[ 󰉋  $path ](fg:#1e1e2e bg:#89b4fa bold)[](fg:#89b4fa)"
truncation_length = 3
truncation_symbol = "…/"
home_symbol = ""

# Rounded Git pills; status only appears when there is something to report.
[git_branch]
symbol = ""
format = " [](fg:#cba6f7)[ $symbol $branch ](fg:#1e1e2e bg:#cba6f7 bold)[](fg:#cba6f7)"

[git_status]
format = " [](fg:#fab387)[ $all_status$ahead_behind ](fg:#1e1e2e bg:#fab387 bold)[](fg:#fab387)"
conflicted = "="
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
up_to_date = ""
untracked = "?${count}"
stashed = "≡"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

[fill]
symbol = " "

[status]
disabled = false
format = " [](fg:#f38ba8)[ 󰅖 $status ](fg:#1e1e2e bg:#f38ba8 bold)[](fg:#f38ba8)"

[cmd_duration]
min_time = 2_000
format = " [󱎫 $duration](fg:#a6adc8)"

[time]
disabled = false
time_format = "%H:%M"
format = " [ $time](fg:#6c7086)"

[character]
success_symbol = "[❯](bold #a6e3a1) "
error_symbol = "[❯](bold #f38ba8) "
vimcmd_symbol = "[❮](bold #89b4fa) "

# Keep the prompt focused on navigation and Git, not language runtimes.
[username]
disabled = true

[hostname]
disabled = true

[nodejs]
disabled = true

[python]
disabled = true

[rust]
disabled = true

[golang]
disabled = true

[docker_context]
disabled = true

[conda]
disabled = true
