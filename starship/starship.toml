# Typography and spacing instead of colored pills.
# ANSI color names follow the active Ghostty theme (currently Ube Milk).
add_newline = true
palette = "atelier"
format = """
$directory\
$git_branch\
$git_status\
$fill\
$status\
$cmd_duration\
$time\
$line_break\
$character"""

[palettes.atelier]
muted = "bright-black"
sage = "green"
gold = "yellow"
red = "red"
blue = "blue"
ube = "purple"

[directory]
format = "[$path]($style)[$read_only]($read_only_style) "
style = "bold"
read_only = " · ro"
read_only_style = "fg:gold"
truncation_length = 3
truncation_symbol = "…/"
home_symbol = "~"

[git_branch]
symbol = "⎇ "
format = "[  $symbol$branch]($style)"
style = "fg:sage"
truncation_length = 28

[git_status]
format = "([  $all_status$ahead_behind]($style))"
style = "fg:gold"
conflicted = "=${count} "
ahead = "↑${count} "
behind = "↓${count} "
diverged = "↑${ahead_count} ↓${behind_count} "
untracked = "?${count} "
stashed = "≡ "
modified = "~${count} "
staged = "+${count} "
renamed = "»${count} "
deleted = "−${count} "

[fill]
symbol = " "

[status]
disabled = false
format = "[  × $status]($style)"
style = "fg:red"

[cmd_duration]
min_time = 2_000
format = "[  $duration]($style)"
style = "fg:gold"

[time]
disabled = false
time_format = "%H:%M"
format = "[  $time]($style)"
style = "fg:muted"

[character]
success_symbol = "[❯](bold fg:ube)"
error_symbol = "[❯](fg:red)"
vimcmd_symbol = "[❮](fg:blue)"
