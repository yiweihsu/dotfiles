# ============================================================
# Tmux Configuration — Industry Standard
# ============================================================

# ----- Prefix -----
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ----- General -----
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g history-limit 50000
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-clipboard on
set -g escape-time 0
set -g focus-events on
set -s extended-keys on
set -as terminal-features 'xterm-ghostty:extkeys'
set -g status-interval 5

# ----- Vi mode -----
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"

# ----- Split panes (intuitive keys) -----
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# ----- New window keeps current path -----
bind c new-window -c "#{pane_current_path}"

# ----- Navigate panes with vim keys -----
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ----- Resize panes -----
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ----- Reload config -----
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"

# ----- Status bar -----
set -g status-position top
set -g status-style "bg=default,fg=#cdd6f4"
set -g status-left "#[fg=#89b4fa]#[fg=#1e1e2e,bg=#89b4fa,bold] #S #[fg=#89b4fa,bg=default] "
set -g status-left-length 30
set -g status-right "#[fg=#45475a]#[fg=#cdd6f4,bg=#45475a] %Y-%m-%d   %H:%M #[fg=#45475a,bg=default]"
set -g status-right-length 50
setw -g window-status-format "#[fg=#6c7086] #I:#W "
setw -g window-status-current-format "#[fg=#cba6f7]#[fg=#1e1e2e,bg=#cba6f7,bold] #I:#W #[fg=#cba6f7,bg=default]"

# ----- Pane borders -----
set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#cba6f7"

# Keep tmux dependency-free: Ghostty handles local tabs/splits, while tmux is
# available as a lightweight remote or long-running session fallback.
