# ============================================================
# Tmux Configuration — Industry Standard
# ============================================================

# ----- Prefix -----
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ----- General -----
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g history-limit 50000
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-clipboard on
set -g escape-time 0
set -g focus-events on
set -s extended-keys on
set -as terminal-features 'xterm-ghostty:extkeys'
set -g status-interval 5

# ----- Vi mode -----
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"

# ----- Split panes (intuitive keys) -----
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# ----- New window keeps current path -----
bind c new-window -c "#{pane_current_path}"

# ----- Navigate panes with vim keys -----
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ----- Resize panes -----
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ----- Reload config -----
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"

# ----- Graphite Atelier status bar -----
set -g status-position top
set -g status-style "bg=default,fg=#929d9b"
set -g status-left "#[fg=#a5b9a1,bold]  #S#[default]  · "
set -g status-left-length 30
set -g status-right "#[fg=#929d9b]%a %d %b  #[fg=#dedbd3]%H:%M  "
set -g status-right-length 40
setw -g window-status-format "#[fg=#929d9b]  #I  #W  "
setw -g window-status-current-format "#[fg=#dedbd3,bold]  #I  #W#[fg=#a5b9a1] •#[default]  "
setw -g window-status-separator ""
setw -g window-status-activity-style "fg=#c8b38a"
set -g message-style "bg=#252a2b,fg=#dedbd3"
setw -g mode-style "bg=#394443,fg=#f2eee5"

# ----- Pane borders -----
set -g pane-border-style "fg=#394443"
set -g pane-active-border-style "fg=#a5b9a1"

# Keep tmux dependency-free: Ghostty handles local tabs/splits, while tmux is
# available as a lightweight remote or long-running session fallback.
