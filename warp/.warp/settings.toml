[appearance]

[appearance.text]
font_name = "JetBrainsMono Nerd Font Mono"
font_size = 14.0
line_height_ratio = 1.65
ligature_rendering_enabled = true
notebook_font_size = 14.0

[appearance.cursor]
cursor_display_type = "block"
cursor_blink = "disabled"

[appearance.window]
override_opacity = 97
override_blur = 12

[appearance.panes]
should_dim_inactive_panes = true

[appearance.input]
input_mode = "waterfall"

[appearance.full_screen_apps]
alt_screen_padding = { custom = { uniform_padding = 16.0 } }

[appearance.themes]
system_theme = false
theme = "dark"

[appearance.vertical_tabs]
enabled = true
show_panel_in_restored_windows = true

[appearance.tabs]
show_indicators_button = true

[general]
default_session_mode = "terminal"
restore_session = true
show_warning_before_quitting = true
should_confirm_close_session = true

[terminal]
copy_on_select = true
osc52_clipboard_access = "write_only"

[terminal.input]
honor_ps1 = true
input_box_type_setting = "classic"

[notifications]
preferences = { mode = "enabled", is_long_running_enabled = true, long_running_threshold = 20, play_notification_sound = false }

[agents]

[agents.third_party]
should_render_cli_agent_toolbar = true

[agents.warp_agent]
is_any_ai_enabled = false

[agents.warp_agent.other]
show_agent_notifications = true
show_conversation_history = true

[agents.execution_profiles]

[agents.execution_profiles.default]
apply_code_diffs = "always_ask"
ask_user_question = "always_ask"
autosync_plans_to_warp_drive = true
base_model = "auto-genius"
command_allowlist = []
command_denylist = [
  'bash(\s.*)?',
  'fish(\s.*)?',
  'pwsh(\s.*)?',
  'sh(\s.*)?',
  'zsh(\s.*)?',
  'curl(\s.*)?',
  'eval(\s.*)?',
  'exec(\s.*)?',
  'source(\s.*)?',
  'wget(\s.*)?',
  'dig(\s.*)?',
  'nslookup(\s.*)?',
  'host(\s.*)?',
  'ssh(\s.*)?',
  'scp(\s.*)?',
  'rsync(\s.*)?',
  'telnet(\s.*)?',
  'rm(\s.*)?',
]
computer_use = "never"
directory_allowlist = []
execute_commands = "agent_decides"
mcp_allowlist = []
mcp_denylist = []
mcp_permissions = "agent_decides"
name = "Default"
read_files = "always_allow"
run_agents = "always_ask"
web_search_enabled = true
write_to_pty = "always_ask"

[code]

[code.editor]
show_code_review_button = true
show_project_explorer = true
show_global_search = true

[warp_drive]
enabled = true
